name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  Atelier:
    permissions:
      contents: read
      # So skipped-attribute checks can be posted.
      checks: write

    uses: JuneStepp/atelier/.github/workflows/discover.yaml@853b02a14aecfd220c8923801fe05ef7ea737617
    with:
      repository: JuneStepp/atelier
      ref: 853b02a14aecfd220c8923801fe05ef7ea737617

    secrets:
       CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
       CACHIX_SIGNING_KEY: ${{ secrets.CACHIX_SIGNING_KEY }}
